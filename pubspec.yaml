name: homesync
description: A home management application with authentication
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & Networking
  dio: ^5.4.0
  http: ^1.1.0
  
  # State Management
  provider: ^6.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  
  # Form Validation
  email_validator: ^2.1.17
  
  # OTP Input
  pinput: ^3.0.1
  
  # Loading & Dialogs
  flutter_spinkit: ^5.2.0
  
  # Toast & Snackbar
  fluttertoast: ^8.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
